<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>匯率計算（App A）</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
.container {
  padding: 20px;
}
.card {
  background: #111;
  border: 1px solid #333;
  border-radius: 16px;
  padding: 16px;
}
input {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #000;
  color: #fff;
}
button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
}
.calc { background:#0a84ff; color:#fff; }
.import { background:#32d74b; color:#000; margin-top:10px; }
</style>
</head>

<body>
<div class="container">
  <h2>💰 匯率計算（App A）</h2>

  <div class="card">
    <input id="amount" placeholder="外幣金額">
    <input id="rate" placeholder="匯率">
    <input id="result" placeholder="HKD" readonly>

    <button class="calc" onclick="calc()">計算</button>
    <button class="import" onclick="importToB()">＋ 匯入帳本</button>
  </div>
</div>

<script>
function calc() {
  result.value = (amount.value * rate.value).toFixed(2);
}

function importToB() {
  const payload = {
    brand: "",
    name: "",
    price: result.value,
    rate: rate.value
  };

  parent.postMessage({
    type: "IMPORT_FROM_A",
    payload
  }, "*");

  alert("已即時匯入帳本");
}
</script>
</body>
</html>
