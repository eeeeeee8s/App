<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>匯率計算</title>

<style>
body {
  margin: 0;
  padding: 20px;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.card {
  background: #111;
  border: 1px solid #333;
  border-radius: 16px;
  padding: 20px;
}

input {
  width: 100%;
  padding: 14px;
  font-size: 20px;
  border-radius: 12px;
  border: none;
  background: #222;
  color: #fff;
  margin-bottom: 12px;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: #32d74b;
  color: #000;
  font-weight: bold;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="card">
  <h2>匯率計算</h2>

  <input id="input1" placeholder="進貨成本">
  <input id="input2" placeholder="售價">

  <button onclick="importToB()">➡️ 匯入帳本</button>
</div>

<script>
function importToB() {
  const item = {
    id: Date.now(),
    brand: "",
    name: "",
    cost: document.getElementById("input1").value,
    sell: document.getElementById("input2").value
  };

  const list = window.parent.SharedStore.get("myStocks");
  list.push(item);
  window.parent.SharedStore.set("myStocks", list);

  alert("✅ 已匯入帳本");
}
</script>

</body>
</html>
