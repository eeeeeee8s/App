<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>匯率計算（App A）</title>

<style>
body{
  background:#000;color:#fff;
  font-family:-apple-system,sans-serif;
  padding:20px
}
.card{
  background:#111;border-radius:16px;
  padding:20px;margin-bottom:20px
}
input{
  width:100%;padding:14px;
  border-radius:12px;border:1px solid #333;
  background:#000;color:#fff;font-size:16px
}
button{
  width:100%;padding:16px;
  border-radius:14px;border:none;
  background:#32d74b;color:#000;
  font-weight:bold;font-size:16px
}
</style>
</head>

<body>

<h1>💱 匯率計算</h1>

<div class="card">
  <input id="originPrice" placeholder="當地價格（例如 12000）" type="number">
  <input id="rate" placeholder="匯率（例如 0.052）" type="number" step="0.001">
  <input id="sell" placeholder="你要賣的價格（HKD）" type="number">
</div>

<button onclick="importToB()">➡️ 匯入到帳本</button>

<script>
function importToB(){
  const data = {
    country: "🇯🇵",
    originText: document.getElementById('originPrice').value + " JPY",
    rate: document.getElementById('rate').value,
    sellPrice: document.getElementById('sell').value
  };

  localStorage.setItem("pendingImport", JSON.stringify(data));
  window.location.href = "app-b.html";
}
</script>

</body>
</html>
