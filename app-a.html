<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>匯率計算</title>

<style>
body { background:#000; color:#fff; font-family:-apple-system; padding:15px }
button { background:#32d74b; color:#000; border:none; padding:14px; border-radius:12px; font-weight:bold; width:100%; margin-top:15px; }
input { background:#111; color:#fff; border:1px solid #333; padding:12px; border-radius:10px; width:100%; }
</style>
</head>

<body>

<h2>💰 匯率計算（App A）</h2>

<input id="amount" placeholder="輸入金額">
<input id="rate" placeholder="匯率">
<input id="result" placeholder="換算結果">

<button onclick="importToBook()">➕ 匯入帳本</button>

<script>
const user = JSON.parse(localStorage.getItem("currentUser"));
if(!user){ alert("未登入"); }

function importToBook(){
  const draft = {
    source: "appA",
    baseAmount: document.getElementById("amount").value,
    rate: document.getElementById("rate").value,
    result: document.getElementById("result").value,
    createdAt: Date.now()
  };

  localStorage.setItem(
    `sharedData_${user.id}`,
    JSON.stringify({ importDraft: draft })
  );

  alert("已匯入帳本，請前往 App B");
}
</script>

</body>
</html>
