<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登入｜代購全能管理系統</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #111;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 32px 24px;
      width: 90%;
      max-width: 360px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 28px;
    }

    .google-lock {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .google-lock > div {
      margin: 0 auto !important;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>代購全能管理系統</h1>
    <p>請使用 Google 帳號登入</p>

    <div
      id="g_id_onload"
      data-client_id="669826332733-1pme1mv2gqsjv2352502nil70h9l9fim.apps.googleusercontent.com"
      data-callback="handleLogin"
      data-auto_prompt="false">
    </div>

    <div class="google-lock">
      <div
        class="g_id_signin"
        data-type="standard"
        data-size="large"
        data-theme="outline"
        data-text="sign_in_with"
        data-shape="pill"
        data-logo_alignment="center">
      </div>
    </div>
  </div>

  <script>
    function handleLogin(response) {
      const payload = JSON.parse(
        atob(response.credential.split('.')[1])
      );

      const user = {
        id: payload.sub,
        name: payload.name,
        email: payload.email
      };

      localStorage.setItem("currentUser", JSON.stringify(user));
      window.location.href = "app.html";
    }
  </script>

</body>
</html>
