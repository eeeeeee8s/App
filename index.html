<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代購全能管理系統</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #000;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.nav {
  display: flex;
  height: 52px;
  background: #111;
  border-bottom: 1px solid #333;
}

.nav button {
  flex: 1;
  background: none;
  border: none;
  color: #888;
  font-size: 14px;
}

.nav button.active {
  color: #0a84ff;
  font-weight: bold;
}

iframe {
  width: 100%;
  height: calc(100vh - 52px);
  border: none;
  display: none;
}

iframe.active {
  display: block;
}
</style>
</head>

<body>
  <div style="color:red;font-size:30px">INDEX-TEST</div>

<div class="nav">
  <button class="active" onclick="show('a', this)">匯率</button>
  <button onclick="show('b', this)">帳本</button>
</div>

<iframe id="a" class="active" src="app-a.html"></iframe>
<iframe id="b" src="app-b.html"></iframe>

<script src="shared.js"></script>

<script>
function show(id, btn) {
  document.querySelectorAll("iframe").forEach(f => f.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}
</script>

</body>
</html>
