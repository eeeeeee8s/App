<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>代購全能管理系統</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

/* ===== 導覽列（不固定、不浮動） ===== */
nav {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: #111;
}

nav button {
  flex: 1;
  padding: 10px;
  border-radius: 12px;
  border: none;
  font-weight: bold;
  background: #222;
  color: #aaa;
}

nav button.active {
  background: #0a84ff;
  color: #fff;
}

nav button.logout {
  background: #ff453a;
  color: #000;
}

/* ===== 區塊 ===== */
section {
  display: none;
  padding: 20px;
}

section.active {
  display: block;
}

/* ===== UI ===== */
.card {
  background: #111;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #000;
  color: #fff;
}

button.main {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  font-weight: bold;
  font-size: 16px;
}

.blue { background: #0a84ff; color: #fff; }
.green { background: #30d158; color: #000; }

.list-item {
  padding: 12px;
  border-bottom: 1px solid #333;
}

.list-item small {
  color: #aaa;
}

/* ===== ＋ ===== */
.plus {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  font-size: 28px;
  background: #0a84ff;
  color: #fff;
  border: none;
  margin: 20px auto 40px;
  display: block;
}
</style>
</head>

<body>

<script>
if (!localStorage.getItem("currentUser")) {
  location.href = "index.html";
}
</script>

<nav>
  <button id="tab-rate" class="active" onclick="show('rate')">💰 匯率</button>
  <button id="tab-book" onclick="show('book')">📦 帳本</button>
  <button class="logout" onclick="logout()">登出</button>
</nav>

<!-- ===== App A ===== -->
<section id="rate" class="active">
  <h2>💰 匯率計算</h2>

  <div class="card">
    <input id="foreign" placeholder="外幣金額" type="number">
    <input id="rateInput" placeholder="匯率" type="number">
    <input id="hkdResult" placeholder="HKD" readonly>

    <button class="main blue" onclick="calc()">計算</button>
    <button class="main green" onclick="importToBook()">＋ 匯入帳本</button>
  </div>
</section>

<!-- ===== App B ===== -->
<section id="book">
  <h2>📦 帳本</h2>

  <div class="card">
    <input id="brand" placeholder="品牌">
    <input id="name" placeholder="商品名稱">
    <input id="hkd" placeholder="售價 (HKD)">
    <input id="rateSaved" placeholder="匯率">

    <button class="main green" onclick="saveItem()">儲存商品</button>
  </div>

  <div class="card">
    <h3>商品列表</h3>
    <div id="list"></div>
  </div>

  <button class="plus" onclick="newItem()">＋</button>
</section>

<script>
function show(id) {
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.getElementById("tab-" + id).classList.add("active");

  if (id === "book") loadImport();
}

function logout() {
  localStorage.removeItem("currentUser");
  location.href = "index.html";
}

/* ===== App A ===== */
function calc() {
  const f = Number(foreign.value);
  const r = Number(rateInput.value);
  if (!f || !r) return;
  hkdResult.value = (f * r).toFixed(2);
}

function importToBook() {
  localStorage.setItem("IMPORT_TMP", JSON.stringify({
    hkd: hkdResult.value,
    rate: rateInput.value
  }));
  show("book");
}

/* ===== App B ===== */
const KEY = "BOOK_ITEMS";
let editIndex = null;

function getItems() {
  return JSON.parse(localStorage.getItem(KEY) || "[]");
}

function saveItems(items) {
  localStorage.setItem(KEY, JSON.stringify(items));
}

function loadImport() {
  const data = JSON.parse(localStorage.getItem("IMPORT_TMP"));
  if (!data) return;
  hkd.value = data.hkd;
  rateSaved.value = data.rate;
}

function saveItem() {
  const items = getItems();
  const obj = {
    brand: brand.value,
    name: name.value,
    hkd: hkd.value,
    rate: rateSaved.value
  };

  if (editIndex === null) {
    items.push(obj);
  } else {
    items[editIndex] = obj;
  }

  saveItems(items);
  clearForm();
  render();
}

function render() {
  const listEl = document.getElementById("list");
  const items = getItems();
  listEl.innerHTML = "";

  if (items.length === 0) {
    listEl.innerHTML = "<small>尚無商品</small>";
    return;
  }

  items.forEach((i, idx) => {
    const div = document.createElement("div");
    div.className = "list-item";
    div.innerHTML = `
      <b>${i.brand || "未命名"} - ${i.name || ""}</b><br>
      <small>HKD ${i.hkd} ｜ 匯率 ${i.rate}</small>
    `;
    div.onclick = () => editItem(idx);
    listEl.appendChild(div);
  });
}

function editItem(i) {
  const item = getItems()[i];
  brand.value = item.brand;
  name.value = item.name;
  hkd.value = item.hkd;
  rateSaved.value = item.rate;
  editIndex = i;
}

function newItem() {
  clearForm();
  editIndex = null;
}

function clearForm() {
  brand.value = "";
  name.value = "";
  hkd.value = "";
  rateSaved.value = "";
}

render();
</script>

</body>
</html>
