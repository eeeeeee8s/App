<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>代購全能管理系統</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 🔐 登入保護 -->
  <script>
    const userRaw = localStorage.getItem("currentUser");
    if (!userRaw) {
      window.location.href = "index.html";
    }
    const CURRENT_USER = JSON.parse(userRaw);
  </script>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* ====== 頂部導覽 ====== */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: #111;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      z-index: 9999;
    }

    .tabs {
      display: flex;
      gap: 6px;
    }

    .tab {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      color: #aaa;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab.active {
      background: #0a84ff;
      color: #fff;
      font-weight: bold;
    }

    .logout-btn {
      background: #ff453a;
      color: #000;
      border: none;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    /* ====== iframe 區域 ====== */
    .content {
      position: fixed;
      top: 56px;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    iframe.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- 🔝 頂部切換列 -->
  <div class="top-bar">
    <div class="tabs">
      <div class="tab active" onclick="switchApp('appA', this)">💰 匯率</div>
      <div class="tab" onclick="switchApp('appB', this)">📦 貨存</div>
      <div class="tab" onclick="switchApp('appC', this)">👥 訂單</div>
    </div>

    <button class="logout-btn" onclick="logout()">登出</button>
  </div>

  <!-- 📦 內容區 -->
  <div class="content">
    <!-- ⚠️ 這三個檔名之後要對應你的原始 App -->
    <iframe id="appA" class="active" src="app-a.html"></iframe>
    <iframe id="appB" src="app-b.html"></iframe>
    <iframe id="appC" src="app-c.html"></iframe>
  </div>

  <script>
    /* ====== App 切換 ====== */
    function switchApp(id, el) {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      el.classList.add("active");

      document.querySelectorAll("iframe").forEach(f => f.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    /* ====== 登出 ====== */
    function logout() {
      localStorage.removeItem("currentUser");
      window.location.href = "index.html";
    }

    /* ====== ⭐ 共用資料接口（之後 A/B/C 會用到） ====== */
    function getCurrentUID() {
      return CURRENT_USER.id;
    }

    // 👉 讓 iframe 裡的 App 可以呼叫
    window.getCurrentUID = getCurrentUID;
  </script>

</body>
</html>
