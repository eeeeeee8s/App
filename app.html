<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>代購全能管理系統</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
    // 🔐 沒登入直接踢回登入頁
    const user = localStorage.getItem("currentUser");
    if (!user) {
      window.location.href = "index.html";
    }
  </script>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 20px;
    }

    h1 {
      font-size: 22px;
    }

    .user {
      color: #aaa;
      margin-bottom: 20px;
    }

    button.logout {
      position: fixed;
      top: 15px;
      right: 15px;
      background: #ff453a;
      color: #000;
      border: none;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <button class="logout" onclick="logout()">登出</button>

  <h1>代購全能管理系統</h1>
  <div class="user" id="userInfo"></div>

  <p>🎉 你已成功登入，這裡之後就是你的完整系統。</p>

  <script>
    const u = JSON.parse(localStorage.getItem("currentUser"));
    document.getElementById("userInfo").innerText =
      `登入中：${u.name} (${u.email})`;

    function logout() {
      localStorage.removeItem("currentUser");
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
