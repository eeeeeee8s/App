<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>代購全能管理系統</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
nav {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: #111;
}
nav button {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #222;
  color: #fff;
}
nav button.active {
  background: #0a84ff;
}
section {
  display: none;
  padding: 16px;
}
section.active {
  display: block;
}
.card {
  background: #111;
  border-radius: 16px;
  padding: 16px;
}
input {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #000;
  color: #fff;
}
button.main {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
}
.green { background:#30d158; color:#000; font-weight:bold; }
.blue { background:#0a84ff; color:#fff; }
.item {
  padding: 10px;
  border-bottom: 1px solid #333;
}
</style>
</head>

<body>
  <div style="color:red;font-size:30px">TEST-123</div>

<nav>
  <button id="tabA" class="active" onclick="show('A')">💰 匯率</button>
  <button id="tabB" onclick="show('B')">📦 帳本</button>
</nav>

<!-- App A -->
<section id="A" class="active">
  <h2>匯率計算</h2>
  <div class="card">
    <input id="a_price" placeholder="外幣價格">
    <input id="a_rate" placeholder="匯率">
    <input id="a_result" placeholder="HKD" disabled>
    <button class="main blue" onclick="calc()">計算</button>
    <button class="main green" onclick="importToB()">＋ 匯入帳本</button>
  </div>
</section>

<!-- App B -->
<section id="B">
  <h2>帳本</h2>
  <div class="card">
    <input id="b_brand" placeholder="品牌">
    <input id="b_name" placeholder="商品名稱">
    <input id="b_price" placeholder="售價 HKD">
    <input id="b_rate" placeholder="匯率">
    <button class="main green" onclick="save()">儲存商品</button>
  </div>

  <div class="card" style="margin-top:12px">
    <h3>商品列表</h3>
    <div id="list"></div>
  </div>
</section>

<script>
let editIndex = null;

function show(tab){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  document.getElementById(tab).classList.add("active");
  document.getElementById("tab"+tab).classList.add("active");
  render();
}

function calc(){
  const p = parseFloat(a_price.value);
  const r = parseFloat(a_rate.value);
  if(!isNaN(p)&&!isNaN(r)) a_result.value = (p*r).toFixed(2);
}

function importToB(){
  const list = load();
  list.push({
    brand:"",
    name:"",
    price:a_result.value,
    rate:a_rate.value
  });
  localStorage.setItem("myStocks",JSON.stringify(list));
  show('B');
}

function load(){
  return JSON.parse(localStorage.getItem("myStocks")||"[]");
}

function save(){
  const list = load();
  const item = {
    brand:b_brand.value,
    name:b_name.value,
    price:b_price.value,
    rate:b_rate.value
  };
  if(editIndex!==null){
    list[editIndex]=item;
  }else{
    list.push(item);
  }
  localStorage.setItem("myStocks",JSON.stringify(list));
  clear();
  render();
}

function render(){
  const list = load();
  const box = document.getElementById("list");
  box.innerHTML="";
  if(list.length===0){
    box.innerHTML="<div style='color:#888'>尚無商品</div>";
    return;
  }
  list.forEach((it,i)=>{
    const d=document.createElement("div");
    d.className="item";
    d.innerHTML=`<b>${it.name||"未命名"}</b><br>HKD ${it.price||"-"} ｜ 匯率 ${it.rate||"-"}
    <br><button onclick="edit(${i})">編輯</button>`;
    box.appendChild(d);
  });
}

function edit(i){
  const it=load()[i];
  editIndex=i;
  b_brand.value=it.brand;
  b_name.value=it.name;
  b_price.value=it.price;
  b_rate.value=it.rate;
}

function clear(){
  editIndex=null;
  b_brand.value="";
  b_name.value="";
  b_price.value="";
  b_rate.value="";
}

render();
</script>

</body>
</html>
