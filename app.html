<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>代購全能管理系統</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

header {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: #111;
}

header button {
  flex: 1;
  padding: 10px;
  border-radius: 12px;
  border: none;
  font-weight: bold;
  background: #222;
  color: #aaa;
}

header button.active {
  background: #0a84ff;
  color: #fff;
}

.logout {
  background: #ff453a !important;
  color: #000 !important;
}

section {
  display: none;
  padding: 20px;
}

section.active {
  display: block;
}

.card {
  background: #111;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 10px;
  border: none;
  background: #000;
  color: #fff;
  border: 1px solid #333;
}

button.main {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  font-weight: bold;
  font-size: 16px;
}

.blue { background: #0a84ff; color: #fff; }
.green { background: #30d158; color: #000; }

.list-item {
  padding: 12px;
  border-bottom: 1px solid #333;
}
.list-item small {
  color: #aaa;
}

.plus {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  font-size: 28px;
  background: #0a84ff;
  color: #fff;
  border: none;
}
</style>
</head>

<body>

<script>
const user = localStorage.getItem("currentUser");
if (!user) location.href = "index.html";
</script>

<header>
  <button onclick="show('rate')" id="tab-rate" class="active">💰 匯率</button>
  <button onclick="show('book')" id="tab-book">📦 帳本</button>
  <button class="logout" onclick="logout()">登出</button>
</header>

<!-- ===== App A：匯率 ===== -->
<section id="rate" class="active">
  <h2>💰 匯率計算</h2>

  <div class="card">
    <input id="price" placeholder="外幣價格" type="number">
    <input id="rateInput" placeholder="匯率" type="number">
    <input id="result" placeholder="HKD" readonly>

    <button class="main blue" onclick="calc()">計算</button>
    <button class="main green" onclick="importToBook()">＋ 匯入帳本</button>
  </div>
</section>

<!-- ===== App B：帳本 ===== -->
<section id="book">
  <h2>📦 帳本</h2>

  <div class="card">
    <input id="brand" placeholder="品牌">
    <input id="name" placeholder="商品名稱">
    <input id="hkd" placeholder="售價 (HKD)">
    <input id="rateSaved" placeholder="匯率">

    <button class="main green" onclick="saveItem()">儲存商品</button>
  </div>

  <div class="card">
    <h3>商品列表</h3>
    <div id="list"></div>
  </div>

  <button class="plus" onclick="newItem()">＋</button>
</section>

<script>
function show(id) {
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.querySelectorAll("header button").forEach(b => b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.getElementById("tab-" + id).classList.add("active");
}

function logout() {
  localStorage.removeItem("currentUser");
  location.href = "index.html";
}

// ===== App A =====
function calc() {
  const p = Number(price.value);
  const r = Number(rateInput.value);
  if (!p || !r) return;
  result.value = (p * r).toFixed(2);
}

function importToBook() {
  localStorage.setItem("import", JSON.stringify({
    hkd: result.value,
    rate: rateInput.value
  }));
  show('book');
  loadImport();
}

// ===== App B =====
let editIndex = null;

function loadImport() {
  const data = JSON.parse(localStorage.getItem("import"));
  if (!data) return;
  hkd.value = data.hkd;
  rateSaved.value = data.rate;
}

function saveItem() {
  const items = JSON.parse(localStorage.getItem("items") || "[]");

  const obj = {
    brand: brand.value,
    name: name.value,
    hkd: hkd.value,
    rate: rateSaved.value
  };

  if (editIndex !== null) {
    items[editIndex] = obj;
    editIndex = null;
  } else {
    items.push(obj);
  }

  localStorage.setItem("items", JSON.stringify(items));
  clearForm();
  render();
}

function render() {
  const items = JSON.parse(localStorage.getItem("items") || "[]");
  list.innerHTML = items.length ? "" : "<small>尚無商品</small>";

  items.forEach((i, idx) => {
    const div = document.createElement("div");
    div.className = "list-item";
    div.innerHTML = `
      <b>${i.brand || "未命名"} - ${i.name || ""}</b><br>
      <small>HKD ${i.hkd} ｜ 匯率 ${i.rate}</small>
    `;
    div.onclick = () => edit(idx);
    list.appendChild(div);
  });
}

function edit(i) {
  const items = JSON.parse(localStorage.getItem("items"));
  const it = items[i];
  brand.value = it.brand;
  name.value = it.name;
  hkd.value = it.hkd;
  rateSaved.value = it.rate;
  editIndex = i;
}

function newItem() {
  clearForm();
  editIndex = null;
}

function clearForm() {
  brand.value = "";
  name.value = "";
  hkd.value = "";
  rateSaved.value = "";
}

render();
</script>

</body>
</html>
