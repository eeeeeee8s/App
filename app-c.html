<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訂單管理（App C）</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont;
  background:#000;
  color:#fff;
  padding:16px;
}
.card{
  background:#1c1c1e;
  border-radius:16px;
  padding:16px;
  border:1px solid #333;
  margin-bottom:16px;
}
h2{margin:12px 0;}
input, select{
  width:100%;
  background:#2c2c2e;
  border:1px solid #3a3a3c;
  color:#fff;
  padding:14px;
  border-radius:12px;
  font-size:16px;
  margin-bottom:12px;
}
button{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
.btn-green{background:#32d74b;color:#000;}
.order-item{
  padding:12px;
  border-bottom:1px solid #333;
}
.small{color:#8e8e93;font-size:13px;}
</style>
</head>

<body>

<h2>🧾 新增訂單</h2>

<div class="card">
  <input id="customer" placeholder="客戶名稱 / ID">

  <select id="productSelect" onchange="onProductChange()">
    <option value="">選擇商品</option>
  </select>

  <select id="variantSelect">
    <option value="">選擇款式</option>
  </select>

  <!-- 測試欄位：拼色 / 顏色（先留） -->
  <input id="testColor" placeholder="顏色 / 拼色（測試用）">

  <input id="qty" type="number" value="1" placeholder="數量">

  <button class="btn-green" onclick="saveOrder()">儲存訂單</button>
</div>

<h2>📦 訂單列表</h2>
<div class="card" id="orderList"></div>

<script>
let stocks = JSON.parse(localStorage.getItem("myStocks") || "[]");
let orders = JSON.parse(localStorage.getItem("myOrders") || "[]");

/* ---------- 初始化商品下拉 ---------- */
function initProducts(){
  const sel = document.getElementById("productSelect");
  sel.innerHTML = '<option value="">選擇商品</option>';

  stocks.forEach((s,i)=>{
    const opt = document.createElement("option");
    opt.value = i;
    opt.text = `${s.brand || "未命名"} ${s.name || ""}`;
    sel.appendChild(opt);
  });
}

/* ---------- 商品 → 款式 ---------- */
function onProductChange(){
  const idx = productSelect.value;
  const vSel = document.getElementById("variantSelect");
  vSel.innerHTML = '<option value="">選擇款式</option>';

  if(idx === "") return;

  const item = stocks[idx];
  if(item.variants && item.variants.length){
    item.variants.forEach(v=>{
      const opt = document.createElement("option");
      opt.value = v.name;
      opt.text = v.name;
      vSel.appendChild(opt);
    });
  }
}

/* ---------- 儲存訂單 ---------- */
function saveOrder(){
  if(productSelect.value === ""){
    alert("請選擇商品");
    return;
  }

  const item = stocks[productSelect.value];

  const order = {
    id: Date.now(),
    customer: customer.value,
    product: item.name,
    brand: item.brand,
    variant: variantSelect.value,
    testColor: testColor.value, // 測試用欄位
    qty: qty.value,
    price: item.price,
    createdAt: new Date().toISOString()
  };

  orders.push(order);
  localStorage.setItem("myOrders", JSON.stringify(orders));
  renderOrders();
  resetForm();
}

/* ---------- UI ---------- */
function renderOrders(){
  const box = document.getElementById("orderList");
  box.innerHTML = "";

  if(!orders.length){
    box.innerHTML = '<div class="small">尚無訂單</div>';
    return;
  }

  orders.forEach(o=>{
    const div = document.createElement("div");
    div.className = "order-item";
    div.innerHTML = `
      <b>${o.customer || "未命名客戶"}</b><br>
      ${o.brand} ${o.product} ${o.variant || ""}<br>
      <span class="small">數量 ${o.qty} ｜ ${o.testColor || ""}</span>
    `;
    box.appendChild(div);
  });
}

function resetForm(){
  customer.value="";
  productSelect.value="";
  variantSelect.innerHTML='<option value="">選擇款式</option>';
  testColor.value="";
  qty.value=1;
}

/* ---------- Init ---------- */
initProducts();
renderOrders();
</script>

</body>
</html>
