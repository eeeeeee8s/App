<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>匯率計算</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
.container {
  padding: 16px;
}
.card {
  background: #111;
  border-radius: 16px;
  padding: 16px;
}
input {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #000;
  color: #fff;
}
button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
}
.calc {
  background: #0a84ff;
  color: #fff;
  margin-bottom: 10px;
}
.save {
  background: #30d158;
  color: #000;
  font-weight: bold;
}
</style>
</head>

<body>
<div class="container">
  <h2>💰 匯率計算</h2>

  <div class="card">
    <input id="price" placeholder="外幣價格" />
    <input id="rate" placeholder="匯率" />
    <input id="result" placeholder="HKD" disabled />

    <button class="calc" onclick="calculate()">計算</button>
    <button class="save" onclick="importToLedger()">＋ 匯入帳本</button>
  </div>
</div>

<script>
function calculate() {
  const price = parseFloat(priceInput.value);
  const rate = parseFloat(rateInput.value);
  if (!isNaN(price) && !isNaN(rate)) {
    resultInput.value = (price * rate).toFixed(2);
  }
}

function importToLedger() {
  const item = {
    brand: "",
    name: "",
    price: resultInput.value,
    rate: rateInput.value
  };

  const list = JSON.parse(localStorage.getItem("myStocks") || "[]");
  list.push(item);
  localStorage.setItem("myStocks", JSON.stringify(list));

  alert("已匯入帳本");
}

const priceInput = document.getElementById("price");
const rateInput = document.getElementById("rate");
const resultInput = document.getElementById("result");
</script>
</body>
</html>
