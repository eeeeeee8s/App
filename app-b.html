<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帳本（App B）</title>

<style>
body{background:#000;color:#fff;font-family:-apple-system,sans-serif;margin:0;padding:15px}
.card{background:#111;border-radius:16px;padding:20px;margin-bottom:15px}
input{width:100%;padding:14px;margin-bottom:10px;border-radius:12px;border:1px solid #333;background:#000;color:#fff}
button{padding:14px;border-radius:12px;border:none;font-weight:bold}
.add{background:#32d74b;color:#000}
.item{padding:12px;border-bottom:1px solid #222;cursor:pointer}
.item:active{background:#222}
.fab{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;background:#0a84ff;color:#fff;font-size:32px;border:none}
</style>
</head>

<body>

<h1>📦 帳本</h1>

<div class="card">
  <input id="brand" placeholder="品牌">
  <input id="name" placeholder="商品名稱">
  <input id="sell" placeholder="售價 (HKD)">
  <input id="note" placeholder="來源 / 備註">
  <button class="add" onclick="save()">儲存</button>
</div>

<div class="card">
  <div id="list">尚無商品</div>
</div>

<button class="fab" onclick="newItem()">＋</button>

<script>
const KEY="myStocks_simple";
let items=JSON.parse(localStorage.getItem(KEY)||"[]");
let editing=null;

function render(){
  const l=document.getElementById("list");
  if(items.length===0){l.innerText="尚無商品";return;}
  l.innerHTML="";
  items.forEach((i,idx)=>{
    const d=document.createElement("div");
    d.className="item";
    d.innerHTML=`<b>${i.name}</b><br><small>${i.brand}｜$${i.sell}</small>`;
    d.onclick=()=>edit(idx);
    l.appendChild(d);
  });
}

function newItem(){
  editing=null;
  brand.value=name.value=sell.value=note.value="";
}

function edit(i){
  editing=i;
  const d=items[i];
  brand.value=d.brand;
  name.value=d.name;
  sell.value=d.sell;
  note.value=d.note||"";
}

function save(){
  const d={
    brand:brand.value,
    name:name.value,
    sell:sell.value,
    note:note.value
  };
  if(editing!==null) items[editing]=d;
  else items.push(d);
  localStorage.setItem(KEY,JSON.stringify(items));
  newItem();render();
}

/* 🔗 接收 A 的匯入（只跑一次） */
const pending=localStorage.getItem("pendingImport");
if(pending){
  const p=JSON.parse(pending);
  note.value=`${p.country}｜${p.originText}｜匯率 ${p.rate}`;
  sell.value=p.sellPrice;
  localStorage.removeItem("pendingImport");
}

render();
</script>

</body>
</html>
