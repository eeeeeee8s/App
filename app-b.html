<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帳本 / 貨存 App B</title>

<style>
:root {
  --green:#32d74b; --card:#1c1c1e; --input:#2c2c2e;
  --blue:#0a84ff; --gray:#8e8e93;
}
body {
  background:#000; color:#fff; font-family:-apple-system;
  margin:0; padding:15px;
}
.header {
  display:flex; justify-content:space-between; align-items:center;
}
.add-btn {
  background:var(--green); color:#000;
  width:36px; height:36px; border-radius:50%;
  border:none; font-size:24px; font-weight:bold;
}
.item-card {
  background:var(--card); border-radius:16px;
  padding:15px; margin-bottom:10px; border:1px solid #333;
}
#form {
  display:none; position:fixed; inset:0; background:#000;
  padding:15px; z-index:9999;
}
.card {
  background:var(--card); border-radius:16px;
  padding:15px; margin-bottom:15px;
}
input {
  width:100%; padding:14px; border-radius:12px;
  border:1px solid #333; background:var(--input);
  color:#fff; margin-bottom:10px;
}
.profit-box {
  border:2px solid var(--green); border-radius:12px;
  padding:12px;
}
.row {
  display:flex; justify-content:space-between;
  font-size:14px; margin-bottom:6px;
}
button.save {
  background:var(--green); color:#000;
  width:100%; padding:14px; border-radius:12px;
  border:none; font-weight:bold;
}
</style>
</head>

<body>

<div id="list-page">
  <div class="header">
    <h2>📦 帳本</h2>
    <button class="add-btn" onclick="openForm()">+</button>
  </div>
  <div id="item-list"></div>
</div>

<div id="form">
  <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
    <span onclick="closeForm()" style="color:#8e8e93;">取消</span>
    <b>新增商品</b>
    <span onclick="saveData()" style="color:var(--green);font-weight:bold;">儲存</span>
  </div>

  <div class="card">
    <input id="brand" placeholder="品牌">
    <input id="name" placeholder="商品名稱">
  </div>

  <div class="card">
    <div class="profit-box">
      <div class="row"><span>原價</span><span id="d-origin">--</span></div>
      <div class="row"><span>成本</span><span id="d-cost">--</span></div>
      <div class="row"><span>售價</span><span id="d-sell">--</span></div>
    </div>
  </div>
</div>

<script>
const user = JSON.parse(localStorage.getItem("currentUser"));
if (!user) document.body.innerHTML = "<h3>請先登入</h3>";

const STORE_KEY = "myStocks_" + user.id;
let items = JSON.parse(localStorage.getItem(STORE_KEY)) || [];

/* ===== 渲染列表 ===== */
function renderList() {
  const list = document.getElementById("item-list");
  list.innerHTML = "";
  if (items.length === 0) {
    list.innerHTML = "<p style='color:#666;'>尚未有商品</p>";
    return;
  }
  items.forEach(item => {
    const div = document.createElement("div");
    div.className = "item-card";
    div.innerHTML = `
      <b>${item.brand}</b><br>
      ${item.name}<br>
      <small>售價：${item.sell}</small>
    `;
    list.appendChild(div);
  });
}

/* ===== 表單 ===== */
function openForm() {
  document.getElementById("form").style.display = "block";
  brand.value = ""; name.value = "";
  loadImportDraft();
}

function closeForm() {
  document.getElementById("form").style.display = "none";
}

/* ===== A → B 匯入 ===== */
function loadImportDraft() {
  const data = JSON.parse(
    localStorage.getItem("sharedData_" + user.id)
  );
  if (!data || !data.importDraft) return;

  const d = data.importDraft;
  d-origin.innerText = d.baseAmount + " " + (d.baseCurrency || "");
  d-cost.innerText = d.cost || "--";
  d-sell.innerText = d.sellPrice || "--";
}

/* ===== 儲存 ===== */
function saveData() {
  const item = {
    brand: brand.value,
    name: name.value,
    sell: document.getElementById("d-sell").innerText,
    createdAt: Date.now()
  };

  items.push(item);
  localStorage.setItem(STORE_KEY, JSON.stringify(items));

  // 清掉匯入草稿
  const sharedKey = "sharedData_" + user.id;
  const shared = JSON.parse(localStorage.getItem(sharedKey)) || {};
  delete shared.importDraft;
  localStorage.setItem(sharedKey, JSON.stringify(shared));

  closeForm();
  renderList();
}

renderList();
</script>

</body>
</html>
