<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>帳本</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.container {
  padding: 16px;
}

.card {
  background: #111;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
}

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #000;
  color: #fff;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
}

.save {
  background: #30d158;
  color: #000;
  font-weight: bold;
}

.list-item {
  padding: 12px;
  border-bottom: 1px solid #333;
  cursor: pointer;
}

.fab {
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #0a84ff;
  color: #fff;
  font-size: 32px;
  border: none;
}
</style>
</head>

<body>
<div class="container">

<h2>📦 帳本</h2>

<div class="card">
  <input id="brand" placeholder="品牌" />
  <input id="name" placeholder="商品名稱" />
  <input id="price" placeholder="售價 (HKD)" />
  <input id="rate" placeholder="匯率" />
  <button class="save" onclick="saveItem()">儲存商品</button>
</div>

<div class="card">
  <h3>商品列表</h3>
  <div id="list"></div>
</div>

</div>

<button class="fab" onclick="newItem()">＋</button>

<script>
let editingIndex = null;

function loadItems() {
  return window.parent.SharedStore.get("myStocks");
}

function render() {
  const list = document.getElementById("list");
  const items = loadItems();
  list.innerHTML = "";

  if (items.length === 0) {
    list.innerHTML = "<div style='color:#888'>尚無商品</div>";
    return;
  }

  items.forEach((item, index) => {
    const div = document.createElement("div");
    div.className = "list-item";
    div.innerHTML = `
      <strong>${item.name || "未命名"}</strong><br>
      HKD ${item.price || "-"} ｜ 匯率 ${item.rate || "-"}
    `;
    div.onclick = () => editItem(index);
    list.appendChild(div);
  });
}

function saveItem() {
  const items = loadItems();

  const item = {
    brand: brand.value,
    name: name.value,
    price: price.value,
    rate: rate.value
  };

  if (editingIndex !== null) {
    items[editingIndex] = item;
  } else {
    items.push(item);
  }

  window.parent.SharedStore.set("myStocks", items);
  clearForm();
  render();
}

function editItem(index) {
  const item = loadItems()[index];
  editingIndex = index;

  brand.value = item.brand;
  name.value = item.name;
  price.value = item.price;
  rate.value = item.rate;
}

function newItem() {
  clearForm();
}

function clearForm() {
  brand.value = "";
  name.value = "";
  price.value = "";
  rate.value = "";
  editingIndex = null;
}

window.addEventListener("shared-update", render);
render();
</script>
</body>
</html>
