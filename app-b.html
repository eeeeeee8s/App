<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帳本（App B）</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont;
  background:#000;
  color:#fff;
  padding:16px;
}
h2{margin:12px 0;}
.card{
  background:#1c1c1e;
  border-radius:16px;
  padding:16px;
  border:1px solid #333;
  margin-bottom:12px;
}
.draft-card{
  border:1px dashed #555;
}
.card-main{
  cursor:pointer;
}
.btn{
  padding:10px 14px;
  border-radius:12px;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
.btn-green{background:#32d74b;color:#000;}
.list-item{
  padding:12px;
  border-bottom:1px solid #333;
  cursor:pointer;
}
input{
  width:100%;
  background:#2c2c2e;
  border:1px solid #3a3a3c;
  color:#fff;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  font-size:16px;
}
.overlay{
  position:fixed;
  inset:0;
  background:#000;
  padding:16px;
  display:none;
  z-index:9999;
}
</style>
</head>

<body>

<h2>🔁 來自匯率的暫存項目</h2>
<div id="draftList"></div>

<h2>📦 帳本商品</h2>
<div id="stockList"></div>

<div class="overlay" id="form">
  <h3 id="formTitle">編輯商品</h3>
  <input id="brand" placeholder="品牌">
  <input id="name" placeholder="商品名稱">
  <input id="price" placeholder="HKD 成本" type="number">
  <input id="rate" placeholder="匯率" type="number">
  <button class="btn btn-green" onclick="saveItem()">儲存</button>
  <button class="btn" onclick="closeForm()">取消</button>
</div>

<script>
let drafts = JSON.parse(localStorage.getItem("sharedDrafts") || "[]");
let stocks = JSON.parse(localStorage.getItem("myStocks") || "[]");
let editing = null;

/* ---------- Drafts ---------- */
function renderDrafts(){
  const box = document.getElementById("draftList");
  box.innerHTML = "";

  if(!drafts.length){
    box.innerHTML = "<div style='color:#888'>尚無暫存</div>";
    return;
  }

  drafts.forEach((d,i)=>{
    const card = document.createElement("div");
    card.className = "card draft-card";

    const main = document.createElement("div");
    main.className = "card-main";
    main.innerHTML = `
      <b>未命名</b><br>
      HKD ${d.hkdCost} ｜ 匯率 ${d.rate}
    `;
    main.onclick = () => openFormFromDraft(i);

    const btn = document.createElement("button");
    btn.className = "btn btn-green";
    btn.innerText = "匯入帳本";
    btn.onclick = (e)=>{
      e.stopPropagation();
      importDraft(i);
    };

    card.appendChild(main);
    card.appendChild(btn);
    box.appendChild(card);
  });
}

/* ---------- Stocks ---------- */
function renderStocks(){
  const box = document.getElementById("stockList");
  box.innerHTML = "";

  if(!stocks.length){
    box.innerHTML = "<div style='color:#888'>尚無商品</div>";
    return;
  }

  stocks.forEach((s,i)=>{
    const div = document.createElement("div");
    div.className = "list-item";
    div.innerHTML = `<b>${s.brand || "未命名"} ${s.name || ""}</b><br>HKD ${s.price}`;
    div.onclick = () => openFormFromStock(i);
    box.appendChild(div);
  });
}

/* ---------- Form ---------- */
function openFormFromDraft(i){
  const d = drafts[i];
  editing = {type:"draft",i};
  formTitle.innerText = "編輯（來自匯率）";
  brand.value = "";
  name.value = "未命名";
  price.value = d.hkdCost;
  rate.value = d.rate;
  form.style.display = "block";
}

function openFormFromStock(i){
  const s = stocks[i];
  editing = {type:"stock",i};
  formTitle.innerText = "編輯商品";
  brand.value = s.brand;
  name.value = s.name;
  price.value = s.price;
  rate.value = s.rate;
  form.style.display = "block";
}

function saveItem(){
  const data = {
    brand: brand.value,
    name: name.value,
    price: price.value,
    rate: rate.value
  };

  if(editing.type === "draft"){
    stocks.push(data);
    drafts.splice(editing.i,1);
  }else{
    stocks[editing.i] = data;
  }

  sync();
  closeForm();
}

function closeForm(){
  form.style.display = "none";
}

/* ---------- Import ---------- */
function importDraft(i){
  const d = drafts[i];
  stocks.push({
    brand:"",
    name:"未命名",
    price:d.hkdCost,
    rate:d.rate
  });
  drafts.splice(i,1);
  sync();
}

/* ---------- Sync ---------- */
function sync(){
  localStorage.setItem("sharedDrafts", JSON.stringify(drafts));
  localStorage.setItem("myStocks", JSON.stringify(stocks));
  renderDrafts();
  renderStocks();
}

renderDrafts();
renderStocks();
</script>

</body>
</html>
