<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帳本</title>

<style>
body {
  margin: 0;
  padding: 20px;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.add {
  background: #32d74b;
  color: #000;
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 22px;
}

.item {
  background: #111;
  border: 1px solid #333;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 10px;
}

#form {
  display: none;
  position: fixed;
  inset: 0;
  background: #000;
  padding: 20px;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: #222;
  color: #fff;
  margin-bottom: 12px;
}

button.save {
  background: #0a84ff;
  color: #fff;
  border: none;
  padding: 14px;
  width: 100%;
  border-radius: 12px;
}
</style>
</head>

<body>

<div class="header">
  <h2>帳本</h2>
  <button class="add" onclick="openForm()">+</button>
</div>

<div id="list"></div>

<div id="form">
  <h3>編輯商品</h3>
  <input id="f-brand" placeholder="品牌">
  <input id="f-name" placeholder="商品名稱">
  <input id="f-cost" placeholder="成本">
  <input id="f-sell" placeholder="售價">
  <button class="save" onclick="save()">儲存</button>
</div>

<script>
let inventory = window.parent.SharedStore.get("myStocks");
let editingIndex = null;

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  inventory.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <b>${item.brand || "未命名"}</b><br>
      ${item.name || "點擊編輯"}<br>
      售價：$${item.sell || "-"}
    `;
    div.onclick = () => openForm(i);
    list.appendChild(div);
  });
}

function openForm(i = null) {
  editingIndex = i;
  document.getElementById("form").style.display = "block";

  if (i !== null) {
    const d = inventory[i];
    f-brand.value = d.brand;
    f-name.value = d.name;
    f-cost.value = d.cost;
    f-sell.value = d.sell;
  } else {
    f-brand.value = "";
    f-name.value = "";
    f-cost.value = "";
    f-sell.value = "";
  }
}

function save() {
  const data = {
    brand: f-brand.value,
    name: f-name.value,
    cost: f-cost.value,
    sell: f-sell.value
  };

  if (editingIndex !== null) inventory[editingIndex] = data;
  else inventory.push(data);

  window.parent.SharedStore.set("myStocks", inventory);
  document.getElementById("form").style.display = "none";
}

window.addEventListener("shared-update", (e) => {
  if (e.detail.key === "myStocks") {
    inventory = e.detail.value;
    render();
  }
});

render();
</script>

</body>
</html>
