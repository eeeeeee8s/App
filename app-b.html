<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>帳本</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
.container {
  padding: 16px;
}
.card {
  background: #111;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
}
input {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #000;
  color: #fff;
}
button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
}
.save {
  background: #30d158;
  color: #000;
  font-weight: bold;
}
.item {
  padding: 12px;
  border-bottom: 1px solid #333;
}
.item button {
  margin-top: 6px;
  background: #0a84ff;
  color: #fff;
}
.fab {
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #0a84ff;
  color: #fff;
  font-size: 32px;
  border: none;
}
</style>
</head>

<body>
<div class="container">
  <h2>📦 帳本</h2>

  <div class="card">
    <input id="brand" placeholder="品牌" />
    <input id="name" placeholder="商品名稱" />
    <input id="price" placeholder="售價 (HKD)" />
    <input id="rate" placeholder="匯率" />
    <button class="save" onclick="save()">儲存商品</button>
  </div>

  <div class="card">
    <h3>商品列表</h3>
    <div id="list"></div>
  </div>
</div>

<button class="fab" onclick="newItem()">＋</button>

<script>
let editIndex = null;

function load() {
  return JSON.parse(localStorage.getItem("myStocks") || "[]");
}

function render() {
  const list = document.getElementById("list");
  const items = load();
  list.innerHTML = "";

  if (items.length === 0) {
    list.innerHTML = "<div style='color:#888'>尚無商品</div>";
    return;
  }

  items.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <strong>${item.name || "未命名"}</strong><br>
      HKD ${item.price || "-"} ｜ 匯率 ${item.rate || "-"}
      <button onclick="edit(${i})">編輯</button>
    `;
    list.appendChild(div);
  });
}

function save() {
  const items = load();
  const item = {
    brand: brand.value,
    name: name.value,
    price: price.value,
    rate: rate.value
  };

  if (editIndex !== null) {
    items[editIndex] = item;
  } else {
    items.push(item);
  }

  localStorage.setItem("myStocks", JSON.stringify(items));
  clearForm();
  render();
}

function edit(i) {
  const item = load()[i];
  editIndex = i;
  brand.value = item.brand;
  name.value = item.name;
  price.value = item.price;
  rate.value = item.rate;
}

function newItem() {
  clearForm();
}

function clearForm() {
  brand.value = "";
  name.value = "";
  price.value = "";
  rate.value = "";
  editIndex = null;
}

render();
</script>
</body>
</html>
